services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: monpro
      POSTGRES_USER: monpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monpro -d monpro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://monpro:${POSTGRES_PASSWORD}@db:5432/monpro?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      OTP_PROVIDER: ${OTP_PROVIDER:-dev}
      AFRICAS_TALKING_API_KEY: ${AFRICAS_TALKING_API_KEY:-}
      AFRICAS_TALKING_USERNAME: ${AFRICAS_TALKING_USERNAME:-sandbox}
      AFRICAS_TALKING_SENDER_ID: ${AFRICAS_TALKING_SENDER_ID:-}
      AFRICAS_TALKING_ENVIRONMENT: ${AFRICAS_TALKING_ENVIRONMENT:-sandbox}
      PUSH_NOTIFICATION_PROVIDER: ${PUSH_NOTIFICATION_PROVIDER:-dev}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      PAYMENT_MODE: ${PAYMENT_MODE:-dev}
      ORANGE_MONEY_API_URL: ${ORANGE_MONEY_API_URL:-}
      ORANGE_MONEY_MERCHANT_KEY: ${ORANGE_MONEY_MERCHANT_KEY:-}
      ORANGE_MONEY_API_SECRET: ${ORANGE_MONEY_API_SECRET:-}
      ORANGE_MONEY_ACCESS_TOKEN: ${ORANGE_MONEY_ACCESS_TOKEN:-}
      ORANGE_MONEY_WEBHOOK_SECRET: ${ORANGE_MONEY_WEBHOOK_SECRET:-}
      MTN_MOMO_API_URL: ${MTN_MOMO_API_URL:-}
      MTN_MOMO_SUBSCRIPTION_KEY: ${MTN_MOMO_SUBSCRIPTION_KEY:-}
      MTN_MOMO_API_KEY: ${MTN_MOMO_API_KEY:-}
      MTN_MOMO_USER_ID: ${MTN_MOMO_USER_ID:-}
      MTN_MOMO_ENV: ${MTN_MOMO_ENV:-sandbox}
      MTN_MOMO_WEBHOOK_SECRET: ${MTN_MOMO_WEBHOOK_SECRET:-}
      MOOV_MONEY_API_URL: ${MOOV_MONEY_API_URL:-}
      MOOV_MONEY_MERCHANT_ID: ${MOOV_MONEY_MERCHANT_ID:-}
      MOOV_MONEY_API_KEY: ${MOOV_MONEY_API_KEY:-}
      MOOV_MONEY_WEBHOOK_SECRET: ${MOOV_MONEY_WEBHOOK_SECRET:-}
      WAVE_API_URL: ${WAVE_API_URL:-}
      WAVE_API_KEY: ${WAVE_API_KEY:-}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    networks:
      - internal
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    networks:
      - internal

  certbot:
    image: certbot/certbot
    depends_on:
      - nginx
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  certbot-etc:
  certbot-var:
  webroot:

networks:
  internal:
    driver: bridge
